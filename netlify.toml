[build]
  command = "npm ci && npm run build"
  publish = ".next"

[build.environment]
  NPM_FLAGS = "--prefer-online"
  NODE_VERSION = "22"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Default for static/ISR HTML pages. `stale-while-revalidate` lets Netlify's
# edge serve the cached response instantly on a background-revalidation miss
# instead of blocking the request on a synchronous Lambda cold start —
# measured TTFB on a cold path was 4.7s vs 0.2s once warm. `revalidate=3600`
# in the page still controls how often ISR actually regenerates the content;
# this only controls how the edge behaves while that regeneration happens.
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, s-maxage=3600, stale-while-revalidate=86400, must-revalidate"

# Hashed Next.js static assets — safe to cache aggressively forever.
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/_next/image*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
