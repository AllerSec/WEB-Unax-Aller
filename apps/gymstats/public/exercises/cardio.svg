<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none" aria-hidden="true">
  <rect width="200" height="200" fill="#efeee9"/>
  <g stroke="#4d6453" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Bike wheels -->
    <circle cx="58" cy="128" r="26" fill="#faf9f4"/>
    <circle cx="58" cy="128" r="20" opacity="0.3"/>
    <circle cx="58" cy="128" r="3" fill="#4d6453"/>
    <path d="M58 108 L58 148 M38 128 L78 128 M44 114 L72 142 M72 114 L44 142" opacity="0.5"/>
    <circle cx="142" cy="128" r="26" fill="#faf9f4"/>
