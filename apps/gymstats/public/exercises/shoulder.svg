<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none" aria-hidden="true">
  <rect width="200" height="200" fill="#efeee9"/>
  <g stroke="#4d6453" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Head -->
    <circle cx="100" cy="42" r="14" fill="#faf9f4"/>
    <!-- Neck -->
    <path d="M92 54 L92 62 M108 54 L108 62"/>
    <!-- Trapezius -->
    <path d="M78 66 Q100 58 122 66 L130 78 Q115 80 100 80 Q85 80 70 78 Z" fill="#b4cdb8" stroke="#4d6453" opacity="0.75"/>
    <!-- Left deltoid (three heads: front/side/rear implied) -->
    <circle cx="60" cy="86" r="18" fill="#b4cdb8" stroke="#4d6453" opacity="0.9"/>
    <path d="M52 78 Q60 74 68 80" opacity="0.5"/>
    <path d="M48 90 L72 90" opacity="0.4"/>
    <path d="M54 96 Q60 100 66 96" opacity="0.5"/>
    <!-- Right deltoid -->
    <circle cx="140" cy="86" r="18" fill="#b4cdb8" stroke="#4d6453" opacity="0.9"/>
    <path d="M132 78 Q140 74 148 80" opacity="0.5"/>
    <path d="M128 90 L152 90" opacity="0.4"/>
    <path d="M134 96 Q140 100 146 96" opacity="0.5"/>
    <!-- Torso top -->
    <path d="M70 100 L72 140 L128 140 L130 100"/>
    <!-- Upper chest hint -->
    <path d="M78 104 Q100 100 122 104"/>
    <!-- Arms going down -->
    <path d="M50 100 L42 150 Q46 154 54 152 L64 110" fill="#faf9f4"/>
    <path d="M150 100 L158 150 Q154 154 146 152 L136 110" fill="#faf9f4"/>
  </g>
  <text x="100" y="190" text-anchor="middle" font-family="Manrope, sans-serif" font-size="8" fill="#737973" letter-spacing="2">HOMBRO</text>
</svg>
