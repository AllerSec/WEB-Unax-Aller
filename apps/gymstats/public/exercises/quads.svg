<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none" aria-hidden="true">
  <rect width="200" height="200" fill="#efeee9"/>
  <g stroke="#4d6453" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Hip line -->
    <path d="M60 34 L140 34 L138 54 L62 54 Z" fill="#faf9f4"/>
    <!-- Left quad -->
    <path d="M64 56 Q56 100 66 150 Q74 156 86 156 Q94 150 96 110 L92 56 Z" fill="#b4cdb8" stroke="#4d6453" opacity="0.9"/>
    <!-- Right quad -->
    <path d="M108 56 L104 110 Q106 150 114 156 Q126 156 134 150 Q144 100 136 56 Z" fill="#b4cdb8" stroke="#4d6453" opacity="0.9"/>
    <!-- Muscle separations (quadriceps heads) -->
