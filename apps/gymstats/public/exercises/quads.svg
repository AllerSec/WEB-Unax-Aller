    <circle cx="80" cy="160" r="6" fill="#faf9f4"/>
    <circle cx="120" cy="160" r="6" fill="#faf9f4"/>
    <!-- Lower legs -->
    <path d="M74 164 L70 184 M86 164 L90 184 M114 164 L110 184 M126 164 L130 184"/>
  </g>
  <text x="100" y="196" text-anchor="middle" font-family="Manrope, sans-serif" font-size="8" fill="#737973" letter-spacing="2">CUÁDRICEPS</text>
</svg>
