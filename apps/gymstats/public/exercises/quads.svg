    <path d="M84 64 L84 140" stroke-dasharray="2 3" opacity="0.4"/>
    <path d="M116 64 L116 140" stroke-dasharray="2 3" opacity="0.4"/>
    <path d="M124 64 Q130 100 124 140" opacity="0.45"/>
